name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-migration-check:
    name: Schema / Migration Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if schema.prisma changed without a new migration
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="$(git rev-parse "$HEAD_SHA^")"
            fi
          fi

          echo "Comparing $BASE_SHA..$HEAD_SHA"
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          SCHEMA_CHANGED=0
          if echo "$CHANGED" | grep -qx 'prisma/schema.prisma'; then
            SCHEMA_CHANGED=1
          fi

          NEW_MIGRATION=0
          if echo "$CHANGED" | grep -E '^prisma/migrations/[^/]+/migration\.sql$' | grep -q .; then
            # Only count if the file was added in this range (not just modified).
            if git diff --name-only --diff-filter=A "$BASE_SHA" "$HEAD_SHA" \
                 | grep -Eq '^prisma/migrations/[^/]+/migration\.sql$'; then
              NEW_MIGRATION=1
            fi
          fi

          if [ "$SCHEMA_CHANGED" = "1" ] && [ "$NEW_MIGRATION" = "0" ]; then
            echo "::error title=Missing Prisma migration::prisma/schema.prisma changed but no new migration file was added under prisma/migrations/. Run 'npx prisma migrate dev --name <change> --create-only' and commit the generated SQL."
            exit 1
          fi

          echo "Schema/migration drift check passed."

  lint-typecheck-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build (includes TypeScript check)
        run: npx next build
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
          AUTH_TOKEN_SECRET: "ci-test-secret-key-minimum-32-chars"
          ADMIN_AUTH_SECRET: "ci-test-admin-secret-32-chars-min"
          OPENROUTER_API_KEY: "sk-fake"
          ADMIN_USERNAME: "ci-admin"
          ADMIN_PASSWORD: "ci-password"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint-typecheck-build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test -- --passWithNoTests
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
          AUTH_TOKEN_SECRET: "ci-test-secret-key-minimum-32-chars"
          ADMIN_AUTH_SECRET: "ci-test-admin-secret-32-chars-min"
