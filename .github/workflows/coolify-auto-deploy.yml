name: Coolify Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: coolify-auto-deploy
  cancel-in-progress: true

jobs:
  trigger-coolify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment webhook
        run: |
          if [ -z "${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}" ]; then
            echo "COOLIFY_DEPLOY_WEBHOOK_URL not set — deploy manually from Coolify."
            exit 0
          fi
          curl --fail --silent --show-error \
            --request GET \
            "${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}"
          echo "Coolify deploy webhook triggered."
