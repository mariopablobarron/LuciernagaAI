name: Coolify Auto Deploy

on:
  push:
    branches:
      - main
    # Evita redeployar cuando el push toca solo documentación. Mantener
    # sincronizado si añades más caminos "no-deploy".
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/workflows/dev-journal.yml"
  workflow_dispatch:

concurrency:
  group: coolify-auto-deploy
  cancel-in-progress: true

jobs:
  trigger-coolify:
    runs-on: ubuntu-latest
    steps:
      # Nota: el deploy principal es VPS Direct Deploy (SSH). Este step
      # intenta también notificar a Coolify como segunda vía, pero no
      # bloquea el pipeline si el webhook está caducado o no configurado.
      # `set +e` evita que `bash -e` aborte el step ante curl timeout (exit 28).
      - name: Trigger Coolify deployment webhook (optional)
        shell: bash
        run: |
          set +e
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "No webhook configured - VPS Direct Deploy is the primary mechanism."
            exit 0
          fi
          HTTP_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 10 --request GET "$COOLIFY_WEBHOOK" 2>/dev/null || echo "000")
          if [ -n "$HTTP_CODE" ] && [ "$HTTP_CODE" -ge 200 ] 2>/dev/null && [ "$HTTP_CODE" -lt 400 ] 2>/dev/null; then
            echo "Coolify deploy triggered via GET (HTTP $HTTP_CODE)."
            exit 0
          fi
          HTTP_CODE_POST=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 10 --request POST "$COOLIFY_WEBHOOK" 2>/dev/null || echo "000")
          if [ -n "$HTTP_CODE_POST" ] && [ "$HTTP_CODE_POST" -ge 200 ] 2>/dev/null && [ "$HTTP_CODE_POST" -lt 400 ] 2>/dev/null; then
            echo "Coolify deploy triggered via POST (HTTP $HTTP_CODE_POST)."
            exit 0
          fi
          echo "Coolify webhook unreachable (GET=$HTTP_CODE, POST=$HTTP_CODE_POST) — VPS Direct Deploy handles the actual deployment."
          echo "To fix: regenerate webhook in Coolify UI and update COOLIFY_DEPLOY_WEBHOOK_URL secret."
          exit 0
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}
