name: Coolify Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: coolify-auto-deploy
  cancel-in-progress: true

jobs:
  trigger-coolify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment webhook
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "No webhook configured - deploy manually from Coolify."
            exit 0
          fi
          curl --fail --silent --show-error --request GET "$COOLIFY_WEBHOOK"
          echo "Coolify deploy triggered."
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}
