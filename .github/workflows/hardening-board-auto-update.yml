name: Hardening Board Auto Update

on:
  schedule:
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-board:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Auto update hardening board
        id: auto_update
        run: npm run hardening:auto

      - name: Open issue when week is blocked
        if: steps.auto_update.outputs.status == 'bloqueado'
        uses: actions/github-script@v7
        with:
          script: |
            const week = "${{ steps.auto_update.outputs.week }}";
            const blocker = "${{ steps.auto_update.outputs.blocker }}";
            const updatedAt = "${{ steps.auto_update.outputs.updatedAt }}";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `[Hardening] Semana ${week} bloqueada`;

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
              per_page: 1,
            });

            if (existing.data.items.length > 0) {
              core.info(`Issue ya abierta: ${existing.data.items[0].html_url}`);
              return;
            }

            const body = [
              "Se detecto bloqueo automatico en el tablero de hardening.",
              "",
              `- Semana: ${week}`,
              `- Estado: bloqueado`,
              `- Bloqueador: ${blocker}`,
              `- Actualizado: ${updatedAt}`,
              `- Run: ${runUrl}`,
              "",
              "Accion sugerida: corregir el bloqueador y re-ejecutar el workflow.",
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });

      - name: Close issue when week is unblocked
        if: steps.auto_update.outputs.status != 'bloqueado'
        uses: actions/github-script@v7
        with:
          script: |
            const week = "${{ steps.auto_update.outputs.week }}";
            const status = "${{ steps.auto_update.outputs.status }}";
            const updatedAt = "${{ steps.auto_update.outputs.updatedAt }}";
            const title = `[Hardening] Semana ${week} bloqueada`;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
              per_page: 10,
            });

            if (existing.data.items.length === 0) {
              core.info("No hay issue abierta para cerrar.");
              return;
            }

            for (const issue of existing.data.items) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  "Cierre automatico de bloqueo de hardening.",
                  `- Semana: ${week}`,
                  `- Estado actual: ${status}`,
                  `- Actualizado: ${updatedAt}`,
                  `- Run: ${runUrl}`,
                ].join("\n"),
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

      - name: Commit changes if needed
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/manual-saas-50p.md
          git commit -m "docs: auto-update hardening board"
          git push
