name: User Manual PDF Auto Update

on:
  push:
    branches: [main]
    paths:
      - docs/manual-usuarios-finales-pdf.md
      - docs/manual-usuarios-finales.md
      - .github/workflows/user-manual-pdf-auto-update.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: user-manual-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PDF from markdown
        uses: docker://pandoc/latex:3.5
        with:
          args: >-
            --from markdown
            --to pdf
            --output docs/manual-usuarios-finales.pdf
            docs/manual-usuarios-finales-pdf.md

      - name: Commit updated PDF
        run: |
          if git diff --quiet -- docs/manual-usuarios-finales.pdf; then
            echo "No PDF changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/manual-usuarios-finales.pdf
          git commit -m "docs: auto-update user manual PDF"
          git push
