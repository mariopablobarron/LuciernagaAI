name: VPS Direct Deploy (luciernaga-ai)

# La app `luciernaga-ai` corre en el VPS desde un compose manual en
# /docker/luciernaga-ai-traefik/, fuera de gestión Coolify (se sacó tras
# el incidente de snapshot restore del 2026-04-30 — Coolify no le aplicaba
# labels Traefik). Por eso el webhook a Coolify no recrea su contenedor.
#
# Este workflow conecta SSH al VPS y dispara el flujo correcto:
#   1. git pull del repo en /tmp/build-luciernaga.
#   2. docker build con tag = commit hash corto.
#   3. sed para apuntar el compose al tag nuevo.
#   4. docker compose up -d.
#   5. smoke test /api/health.
#
# HISTORIA DEL RUNNER (leer antes de cambiar esto):
#   - Hasta 2026-06-23: GH-hosted + SSH (este mismo diseño). Se cambió a
#     runner self-hosted porque fail2ban baneaba IPs de runners de GitHub.
#   - 2026-06-24: incidente de CPU (runners de CI compilando en prod) →
#     se instaló /usr/local/bin/cpu-throttle-guard.sh en el VPS, que MATA
#     cualquier runner de GH Actions cada 5 min. El runner self-hosted
#     quedó roto por diseño: deploys en cola infinita o muertos a mitad
#     (visto 2026-07-04, run 28687363780).
#   - 2026-07-04: vuelta a GH-hosted + SSH (decisión de Mario, opción A).
#     La key de deploy está RESTRINGIDA en authorized_keys con
#     command="/root/deploy-mentor-web.sh" — esta sesión SSH solo puede
#     ejecutar el script de deploy, haga lo que haga el YAML.
#
# El script vive en /root/deploy-mentor-web.sh en el VPS (toda la lógica
# de deploy está allí, no aquí — ver docs/setup-auto-deploy.md).
#
# Secrets: VPS_SSH_KEY (obligatorio), TELEGRAM_BOT_TOKEN + ADMIN_TELEGRAM_ID
# (opcionales, para la notificación).

# 2026-07-06: el trigger de push se retira — el deploy automático lo hace
# ahora el VPS por PULL (cron /usr/local/bin/mentor-deploy-watcher.sh, cada
# minuto: compara HEAD de origin/main con el tag de la imagen desplegada y
# lanza /root/deploy-mentor-web.sh). Motivo: el SSH entrante desde runners
# de GitHub fallaba de forma intermitente — la blocklist comunitaria de
# CrowdSec banea rangos de Azure que engloban las IPs de los runners, y la
# allowlist no anula bans de rangos más amplios. Mismo patrón que el HUB.
# Este workflow queda como fallback MANUAL (workflow_dispatch).
on:
  workflow_dispatch:

concurrency:
  group: vps-direct-deploy
  cancel-in-progress: false # no cancelar deploy en curso si llega otro

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35 # Build cold con cache invalidado puede tomar 15-20 min.

    steps:
      - name: Deploy (SSH al VPS, script restringido)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_deploy
          chmod 600 ~/.ssh/vps_deploy
          # La key está restringida con command="/root/deploy-mentor-web.sh"
          # en el VPS: el comando pasado aquí se ignora y siempre corre el
          # script. ServerAliveInterval mantiene viva la sesión durante el
          # docker build (15-20 min en frío).
          #
          # Reintentos: la conexión desde runners de GitHub falla a veces con
          # "Connection timed out" transitorio (visto run 28697705935 el
          # 2026-07-04 — no era ban de CrowdSec ni firewall). exit 255 = fallo
          # de conexión SSH → reintentar; cualquier otro código viene del
          # script de deploy y NO se reintenta (un build fallido no mejora
          # repitiéndolo y el script no es abortable a medias sin riesgo).
          for attempt in 1 2 3 4; do
            set +e
            ssh -i ~/.ssh/vps_deploy \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=25 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=60 \
              root@72.61.195.108 "/root/deploy-mentor-web.sh"
            CODE=$?
            set -e
            [ "$CODE" -eq 0 ] && exit 0
            if [ "$CODE" -ne 255 ]; then
              echo "::error::deploy-mentor-web.sh terminó con código $CODE (no es fallo de conexión — sin reintento)"
              exit "$CODE"
            fi
            echo "Conexión SSH fallida (intento $attempt/4) — espera 30s..."
            sleep 30
          done
          echo "::error::SSH no conectó tras 4 intentos"
          exit 255

      - name: Verificar que la web responde
        run: |
          sleep 5
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 8 https://tresmilmillonesdelatidos.es/api/health || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "✅ Health: HTTP 200"
              curl -sS https://tresmilmillonesdelatidos.es/api/health | head -c 400
              echo ""
              exit 0
            fi
            echo "Intento $i — HTTP $CODE — espera 10s..."
            sleep 10
          done
          echo "::error::Health check no llegó a 200 tras 60s"
          exit 1

      - name: Notificar Telegram (opcional)
        if: always() && env.TELEGRAM_BOT_TOKEN != '' && env.ADMIN_TELEGRAM_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
        run: |
          STATUS_EMOJI="✅"
          [ "${{ job.status }}" = "failure" ] && STATUS_EMOJI="🔴"
          [ "${{ job.status }}" = "cancelled" ] && STATUS_EMOJI="⚠️"
          MSG="${STATUS_EMOJI} VPS Deploy ${{ job.status }} — commit ${GITHUB_SHA::7} (${GITHUB_ACTOR})%0Ahttps://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${ADMIN_TELEGRAM_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" > /dev/null
